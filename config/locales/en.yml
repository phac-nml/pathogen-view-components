---
en:
  pathogen:
    data_grid:
      empty_state:
        default: No rows found. Try adjusting filters or refreshing the data.
      error_state:
        message: Something went wrong while rendering this grid. Refresh or try again.
        title: Unable to load grid content
      keyboard:
        help: 'Keyboard: Arrow keys move cells; Enter or F2 enters controls; Escape
          returns to the grid.'
      scroll:
        hint: Scroll horizontally to view more columns.
      virtual:
        loaded: Rows loaded.
        loading: Loading rows…
        pagination:
          fetch_error: Unable to load more rows. Scroll to try again.
          loading_more: Loading more rows…
    form:
      switch:
        'off': 'Off'
        'on': 'On'
    label:
      required_indicator: "*"
      title: required
    link:
      aria-label: "%{content} (opens in a new window)"
    sidebar:
      provider:
        announce_closed: Sidebar closed.
        announce_expanded: Sidebar expanded.
        announce_opened: Sidebar opened.
        announce_rail: Sidebar collapsed to icons.
        close_label: Close sidebar
        collapse_label: Collapse sidebar
        expand_label: Expand sidebar
        open_label: Open sidebar
        overlay_label: Close sidebar
      trigger:
        open_label: Open sidebar
    tooltip:
      portal:
        aria_label: Tooltips
