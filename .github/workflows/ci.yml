name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@24.14.1
          cache: true

      - name: Lint JavaScript and ERB
        run: pnpm lint

      - name: Run JavaScript tests with coverage
        run: pnpm test:coverage

      - name: Capture JavaScript coverage metrics
        id: coverage
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const summaryPath = "coverage/coverage-summary.json";
          const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8")).total;

          const toFixed = (metric) => Number(summary[metric].pct).toFixed(2);
          console.log(`lines=${toFixed("lines")}`);
          console.log(`statements=${toFixed("statements")}`);
          console.log(`functions=${toFixed("functions")}`);
          console.log(`branches=${toFixed("branches")}`);
          NODE

      - name: Publish JavaScript coverage summary
        run: |
          {
            echo "### JavaScript Coverage"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | ---: |"
            echo "| Lines | ${{ steps.coverage.outputs.lines }}% |"
            echo "| Statements | ${{ steps.coverage.outputs.statements }}% |"
            echo "| Functions | ${{ steps.coverage.outputs.functions }}% |"
            echo "| Branches | ${{ steps.coverage.outputs.branches }}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment JavaScript coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          COVERAGE_LINES: ${{ steps.coverage.outputs.lines }}
          COVERAGE_STATEMENTS: ${{ steps.coverage.outputs.statements }}
          COVERAGE_FUNCTIONS: ${{ steps.coverage.outputs.functions }}
          COVERAGE_BRANCHES: ${{ steps.coverage.outputs.branches }}
        with:
          script: |
            const marker = "<!-- pvc-javascript-coverage -->";
            const body = [
              marker,
              "### JavaScript Coverage",
              "",
              "| Metric | Coverage |",
              "| --- | ---: |",
              `| Lines | ${process.env.COVERAGE_LINES}% |`,
              `| Statements | ${process.env.COVERAGE_STATEMENTS}% |`,
              `| Functions | ${process.env.COVERAGE_FUNCTIONS}% |`,
              `| Branches | ${process.env.COVERAGE_BRANCHES}% |`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.data.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload JavaScript coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: javascript-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: javascript
          fail_ci_if_error: false
          verbose: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check i18n health
        run: bundle exec i18n-tasks health

      - name: Lint
        run: bin/bundle exec rubocop

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up pnpm and install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@24.14.1
          cache: true

      - name: Verify bin scripts are executable
        run: test -x bin/rails && test -x bin/test && test -x bin/verify

      - name: Verify shipped files
        run: bin/verify

      - name: Test
        run: bin/test

  demo:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/demo/Gemfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up pnpm and install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@24.14.1
          cache: true

      - name: Precompile production assets
        working-directory: demo
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
        run: bin/rails assets:precompile

      - name: Verify production assets and boot
        working-directory: demo
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
        run: bin/verify-assets

      - name: Test demo integration
        working-directory: demo
        env:
          PARALLEL_WORKERS: "4"
        run: bin/rails test
