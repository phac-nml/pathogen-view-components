name: Publish component catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24.14.1
          cache: true

      - name: Install JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir catalog install --frozen-lockfile

      - name: Build catalog
        run: pnpm --dir catalog build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: catalog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
